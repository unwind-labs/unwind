      result: '## Web Frontend Architectural Review


        ### Component complexity


        - **CanvasPane.tsx (761 LOC)** carries three concerns: ReactFlow plumbing, keyboard navigation, and auto-fit. The
        `navStateRef` mutable-ref pattern (`CanvasPane.tsx:345–366`) exists *only* because the keydown effect (line 368) refuses
        to re-attach. Extract three subhooks (`useCanvasKeyboard`, `useCanvasAutoFit`, `useCanvasTree -> nodes/edges`) and
        the file drops below 400 LOC. The `treeToReactFlow` + dagre block can also move to its own file.

        - **TracePane.tsx (881 LOC)** is large but more cohesive; the bulk is markdown/tool-result renderers. Split out `MessageGroup`
        + `SpawnCard` components.

        - **CompactCard.tsx:125** computes `rows = deriveRows(...)` outside `useMemo` — recomputed on every render even when
        `windowed` and `messages` are reference-stable. Wrap it.


        ### State management coherence


        - `store/ui.ts:107–115` `applyUrlState` resets `threadSessionId := rootSessionId` unconditionally, but `threadSessionId`
        is otherwise an independent field via `selectThreadSession`. Either URL-sync it too, or drop the field — currently
        a refresh silently loses divergent state.

        - `lib/url-sync.ts:50` `isApplyingFromUrl` is a module-level flag, plus `writeHistoryDirect` (line 163) duplicates
        `writeHistory` (line 63) only to bypass that flag. Replace with a `{ force?: boolean }` arg on a single function.


        ### DRY violations


        - The "is user typing?" predicate (`INPUT/TEXTAREA/isContentEditable`) is duplicated three times: `App.tsx:41-45`,
        `CanvasPane.tsx:370-375`, `TracePane.tsx:60-66`. Extract to `lib/keyboard.ts:isTypingTarget(e)`.

        - The `[windowStart, windowEnd)` filter over `extra_spawns` is duplicated verbatim in `CompactCard.tsx:113-119` and
        `TracePane.tsx:227-231`. Hoist to `panes/instances.ts:filterExtrasByWindow`.

        - Three independent global `keydown` listeners (App + Canvas + TracePane) on the same root, papered over with `stopImmediatePropagation`
        (`App.tsx:71`). Centralize in one keymap dispatcher keyed off `focusedPane`.


        ### Performance / re-renders


        - **Polling is double-counted.** `useSessions`, `useCanvasTree`, `useMessages` each `refetchInterval: 3_000` (`api/client.ts:58,
        78, 98`) while the WS already fires `tree_changed`/`messages_appended` and invalidates them. Drop polling to 30s as
        a safety net; rely on WS for the hot path. Today every 3s the entire canvas re-fetches even when idle.

        - N cards sharing one session_id each call `useMessages` and re-derive `windowed` on every WS patch. Lift `useMessages`
        into `CanvasInner`, pass `messagesBySession` down, derive `windowed` per-card from a memoized map.


        ### WebSocket


        - `ws/client.ts:79-81` backoff has no jitter and no `visibilitychange`/`online` reconnect trigger — background tabs
        that hit the 10s cap stay disconnected silently. Add jitter (±25%) and an immediate retry on tab refocus.

        - The pending `setTimeout(connect, delay)` (line 81) is not cleared on unmount; the `cancelled` guard handles correctness
        but leaks a pending callback.


        ### Security


        - `slug` and `sessionId` are interpolated into URLs without `encodeURIComponent` in `api/client.ts:56, 74, 91` (only
        `ws/client.ts:48` does it correctly). A URL with `?project=../x` becomes a path-traversal-style request. Encode all
        path segments.

        - `ReactMarkdown` is used without `rehypeRaw`, so HTML is escaped by default — OK. But arbitrary link `href`s render
        unsanitized; consider a `urlTransform` to strip `javascript:` URIs.


        ### Accessibility


        - `PaneFrame` (`App.tsx:122`) is a bare `<div>` with `onMouseDown` only — no `tabIndex`, no `role`, no keyboard route
        in on first load. Add `tabIndex={0}` + `role="region"` + `aria-label`.

        - Card buttons lack `aria-keyshortcuts`; the README advertises `↑/↓/←/→/Enter/Esc` but screen readers get no hint.

        - Only 3 `aria-*` attributes across all panes — broad gap.


        ### Top 5 fixes, ordered


        1. Encode URL path segments in `api/client.ts` (security).

        2. Drop the 3s polling, lean on WS, keep 30s safety polling (perf, ~10× fewer requests).

        3. Extract `isTypingTarget` + centralize keydown dispatcher (DRY + bug-prone).

        4. Lift `useMessages` out of `CompactCardNode`; memoize `rows` (re-render perf).

        5. Make `PaneFrame` keyboard-focusable and label it (a11y).'

    state:
      session_id: 21271370-b943-465a-be80-bde598c36fde
      result: '## Backend Performance Review — unwind/src/unwind/


        ### 🔴 Severe (request-rate hot paths)


        1. **`spawns.py:425 _invoke_id_to_parent_session`** — full-parse of EVERY project JSONL on each `SpawnResolver` instantiation.
        Resolver is created per-request (`spawn_resolver_for_slug`). For a project with 50× 10MB JSONLs that''s a multi-second
        scan on every `/messages`, `/canvas`, `/sessions` call. **Fix:** cache the invoke→parent map on the registry (slug-level),
        invalidate from the watcher when a JSONL changes (mtime-keyed like `SessionIndex._cache`). Or scan only assistant
        records carrying callstack tool_use names — bail out of `iter_lines` after no tool_use found in head N records.


        2. **`sessions_api.py:520 _is_at_user_yield`** — full-file iter on every `list_sessions` row whose session is `active_session_id`.
        Called per-row in `list_sessions` and again in `get_session`. **Fix:** tail-read last ~64KB via `iter_lines_from(path,
        max(0, size-65536))`; the yield envelope is in the last record by construction.


        3. **`sessions_api.py:326 collect_uuids(anc_path)`** — for every ancestor on every `/messages` call, reads the entire
        JSONL into a set. No caching. **Fix:** memoize per (slug, session_id) keyed by mtime+size in `registry`. Same pattern
        as `SessionIndex._cache`.


        4. **`messages.py:330 read_messages_with_lineage`** — calls `read_messages` (full JSONL parse) for self **plus every
        ancestor** on every request, then re-sorts the merged list. No cache layer. **Fix:** a `MessagePageCache` keyed by
        mtime+size; ancestors rarely change so this is high hit-rate.


        ### 🟡 Notable


        5. **`sessions_api.py:430 get_canvas_tree`** computes full body + SHA1 BEFORE the `If-None-Match` check, defeating
        most of the 304 win. **Fix:** derive ETag from cheap project-state hash (max(mtime) of project_dir JSONLs + callstack_log_dir
        mtime); only serialize on miss.


        6. **`messages.py:_normalize_record` + `to_dict`** — every message goes record→Message→dict→FastAPI-JSON. Double-pass
        over potentially MBs of `tool_result.content`. **Fix:** stream JSON directly via `orjson` + custom `Response`, skip
        pydantic for the messages list (it''s already `list[dict]` in `MessagesResponse`).


        7. **`watcher.py:36 DEBOUNCE_SEC=0.20`** uses `threading.Timer` (spawns thread per burst); on heavy turns this churns
        threads. **Fix:** single long-lived flush thread + `threading.Event.wait(timeout)`.


        8. **`watcher.py:218 _handle_callstack` → `ci.all_reports()`** rescans on every callstack-dir event without debouncing
        per-file; YAML parse is the most expensive op in the codebase. **Fix:** per-file mtime cache (likely already there
        in CallstackIndex — verify and ensure event handler doesn''t blow it away).


        ### 🟢 Smaller wins


        - `jsonl.iter_lines` reads line-by-line via text mode; for 10MB files binary read+split (as `iter_lines_from` already
        does) is ~2× faster.

        - `messages._parse_ts` and `jsonl._parse_ts` duplicated; both do `astimezone(utc)` per record (millions of calls).
        Cache a fast-path for the common `Z`-suffixed ISO format using `datetime.fromisoformat` directly without zone conversion
        when it already ends in `+00:00`.

        - `sessions_api.list_sessions` calls `index.list_sessions()` (full scan) AND `_active_session_for_project` (which
        calls it again). Pass the already-loaded list down.

        - `canvas_tree.py` — `scan_session` cache is good; `build_canvas_tree` recomputes windows per call. If `_display_order_for`
        is invoked per parent, ensure spawn anchoring isn''t re-run per child (currently looks OK but verify N×M with deep
        trees).


        No algorithmic O(n²) hotspots in spawn/canvas tree building itself — the bottleneck is redundant full-file rescans
        across requests, not tree shape.'
      summary: 'Performance audit done. Key wins: cache invoke→parent map (spawns.py:425), tail-read instead of full-scan
        for yield detection (sessions_api.py:520), memoize collect_uuids and read_messages by mtime, derive canvas ETag from
        project state hash before serialization, drop pydantic for messages payload, single flush thread instead of Timer-per-burst.'
      suggested_next: Suggest user prioritize the SpawnResolver caching fix — it's the single biggest hit and lands on every
        API call.
      kind: done

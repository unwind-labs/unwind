      result: '# Python Backend Security Review — unwind


        ## Critical


        **1. Path traversal in SPA fallback — `server.py:101–111`**

        The catch-all route uses `target = STATIC_DIR / full_path` where `full_path: str` is a Starlette `:path` param that
        *does* contain `/`. `target.is_file()` is then served verbatim via `FileResponse`. Request `GET /../../../etc/passwd`
        (or `/Users/<u>/.ssh/id_rsa`) resolves outside `STATIC_DIR` and is returned. Fix: `target = (STATIC_DIR / full_path).resolve()`
        and require `STATIC_DIR.resolve() in target.parents`.


        **2. WebSocket has no Origin check — `api/ws.py:18–30`**

        `ws_endpoint` accepts any browser without validating `Origin`. CORS does not apply to WebSockets; combined with DNS
        rebinding any remote site can subscribe to `?project=<slug>` and exfiltrate live Claude transcripts. Fix: explicit
        origin allow-list before `ws.accept()`.


        **3. Native dialog reachable without auth/CSRF — `api/projects.py:110–133`**

        `POST /api/projects/pick-folder` triggers a system folder picker and registers the result. No auth, no CSRF token,
        and CORS allow-list does include `localhost:5173`. A malicious local page can spam blocking modal dialogs and silently
        re-point the server at a different folder. Fix: require an opaque per-launch token issued to the CLI-spawned browser.


        ## High


        **4. AppleScript injection latent — `dialog.py:46–48`**

        `f''default location (POSIX file "{initial}")''` is unquoted interpolation into `osascript -e`. Currently unreachable
        (`pick_folder()` is called with `initial=None`), but any future caller passing user input executes arbitrary AppleScript.
        Use `osascript -e SCRIPT -- ARG` form or escape `"` / `\`.


        **5. `slug` and `session_id` are unvalidated path params**

        `sessions.py:57,63` does `project_dir / f"{session_id}.jsonl"` and `registry.py:69` does `claude_projects_root() /
        slug`. FastAPI strips `/`, so full traversal is blocked, but `..` segments are still accepted (`session_id=".."` →
        reads `<project_dir>/...jsonl`). Validate with a strict regex (UUID for session, `^[A-Za-z0-9-]+$` for slug) at the
        route layer.


        ## Medium


        **6. `/api/docs` and `/api/openapi.json` exposed — `server.py:53–55`** — useful in dev, but with no bind-address guard
        in `server.py` they leak the entire API surface to anyone who can reach the port. Confirm `uvicorn` is bound to `127.0.0.1`;
        gate docs behind a debug flag.


        **7. `list_known_projects` (`registry.py:191–207`) iterates every dir under `~/.claude/projects/`** — enumerable via
        `GET /api/projects` to any local origin allowed by CORS. Same auth-token fix as #3.


        ## Low / OK


        - JSONL parsing (`jsonl.py:26–80`) handles malformed input correctly (skip + utf-8 errors=replace; bounded).

        - WebSocket `recv` only honors `"ping"`; other client messages ignored — fine.

        - No `subprocess shell=True`, no `eval`/`exec` on user input.

        - `processes.py` (psutil) — read-only, safe.

        - File reads are size-bounded by JSONL line iterator; no zip-bomb-style amplification.'
      summary: 'Reviewed projects.py, registry.py, jsonl.py, server.py, api/sessions_api.py, api/ws.py, api/projects.py, sessions.py,

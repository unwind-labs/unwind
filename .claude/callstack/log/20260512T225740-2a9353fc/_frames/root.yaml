    state:
      session_id: fcc58c7c-9763-458e-82e7-6db4013afaeb
      result: '# Backend Architectural Review — Python (src/unwind/)


        ## Top duplications (DRY violations)


        **1. `_parse_ts` redefined 5 times** — `jsonl.py:199`, `callstack.py:588`, `canvas_tree.py:210`, `messages.py:524`,
        `spawns.py:615`. All parse the same JSONL timestamp shape. → Move to `jsonl.py` (already the lowest-level module)
        and import everywhere.


        **2. `CALLSTACK_TOOL_NAMES` duplicated** — `spawns.py:39` and `canvas_tree.py:39` keep identical frozensets, with
        `canvas_tree.py:35-37` literally commenting that they''re kept ''for symmetry''. canvas_tree.py doesn''t even use
        the constant (the actual edge source is `report.yaml`); it''s dead weight. → Keep one copy in `spawns.py`, delete
        from `canvas_tree.py`.


        **3. Assistant-text extraction** — `_assistant_text` (`spawns.py:597`) and `_extract_assistant_text` (`canvas_tree.py:192`)
        are near-clones. → One helper in `jsonl.py` or a new `records.py`.


        **4. `_stringify_result`** — `spawns.py:566` and `cli_cmds/_render.py:195` independently flatten a tool_result block
        list to text. → Promote to `messages.py` (already owns tool_result normalization).


        ## Architectural overlap: spawn/tree logic


        The codebase has **two parallel spawn-resolution stacks**:


        - `spawns.SpawnResolver` → flat `list[Spawn]` consumed by `messages.annotate_spawns` (CompactCard rows).

        - `canvas_tree.collect_invocations` + `build_canvas_tree` → windowed tree for the Canvas pane.


        `canvas_tree.py:248-258` shows the seam: `build_canvas_tree` *accepts* a `SpawnResolver` but, when none is passed,
        **constructs its own** from the same three primitives (`CallstackIndex`, `ForkDetector`, `SubagentIndex`). Same for
        `messages.annotate_spawns` (`messages.py:179-202` `_resolver_from_legacy_args`). The ''single source of truth'' promise
        in `spawns.py:11-23` is only half-kept — both consumers still know how to compose the resolver themselves.


        The header comment in `canvas_tree.py:13-19` says it ''replaces the incremental, race-prone protocol'' — but `spawns.py`
        + `messages.annotate_spawns` is *exactly* that prior protocol, still in production for the compact card. Two trees
        of truth, both backed by the same three indexes.


        **Consolidation proposal:**

        - Make `SpawnResolver` the **only** constructor of `(CallstackIndex, ForkDetector, SubagentIndex)` triples. Force
        callers to pass a resolver; delete `_resolver_from_legacy_args` and the matching block in `canvas_tree.py:249-258`.
        Update tests to construct a real resolver (they''re the only reason legacy kwargs exist).

        - Move `Spawn → window mapping` (currently in `canvas_tree._compute_windows` + `collect_invocations`) into `spawns.py`
        as a method on `SpawnResolver`. canvas_tree.py then becomes pure layout: take windows, render tree.


        ## Module-boundary smells


        - **`fork_detect.py` (352 LOC)** mixes (a) prologue-marker fork detection, (b) family/divergence-text indexing for
        the session list. (b) is really sessions-list concerns and only weakly related to spawn classification. Consider splitting
        `_enrich_divergence_for_root` + `find_session_by_divergence_text` into `sessions.py`.

        - **`messages.py` (532 LOC)** owns both record normalization *and* spawn annotation. `annotate_spawns` is a 70-line
        method that only mutates `Message` objects via a resolver — it belongs in `spawns.py` as `SpawnResolver.annotate(messages)`.
        That removes the awkward mid-file `from .spawns import` at `messages.py:119`.

        - **`cli_cmds/messages.py` vs `cli_cmds/_render.py`** — boundary is OK; `_load_messages` is loader, `_render` is presenter.
        Only friction: `_render._stringify_result` duplicates server-side logic (see #4 above).


        ## Smaller wins


        - `canvas_tree.py:540 _display_order_for` and `spawns.py:240 child_display_order` solve the same ''order siblings
        by start_ts'' problem against different inputs. Unify on `Spawn.started_at` once spawns own windowing.

